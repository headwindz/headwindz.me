<svg xmlns="http://www.w3.org/2000/svg" width="760" height="665" viewBox="0 0 760 665" role="img" aria-labelledby="title desc"><title id="title">A stable alias across themes</title><desc id="desc">The palette offers blue 600 and blue 300. Light and dark themes map action background to different palette values. The button background aliases action background, so the button CSS rule stays the same.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><style>text{font-family:'Comic Sans MS','Chalkboard SE',cursive;fill:#243449}.line{fill:none;stroke:#475569;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}</style><text x="380" y="43" text-anchor="middle" font-size="30" font-weight="bold"><tspan x="380" dy="0">A stable alias across themes</tspan></text><path d="M163 82 Q150 80 152 95 L150 157 Q151 171 165 169 L597 171 Q611 170 609 155 L611 93 Q610 80 596 81 Z" fill="#e7f0fc" stroke="#4876ad" stroke-width="2.5"/><text x="380.0" y="117.0" text-anchor="middle" font-size="25"><tspan x="380.0" dy="0">Palette</tspan><tspan x="380.0" dy="32">blue 600 · blue 300</tspan></text><path d="M280 173 Q200 195 195 225" class="line" marker-end="url(#arrow)"/><path d="M480 173 Q560 195 565 225" class="line" marker-end="url(#arrow)"/><path d="M48 232 Q35 230 37 245 L35 337 Q36 351 50 349 L342 351 Q356 350 354 335 L356 243 Q355 230 341 231 Z" fill="#e7f0fc" stroke="#4876ad" stroke-width="2.5"/><text x="195.0" y="282.0" text-anchor="middle" font-size="25"><tspan x="195.0" dy="0">Light theme</tspan><tspan x="195.0" dy="32">action-bg → blue 600</tspan></text><path d="M418 232 Q405 230 407 245 L405 337 Q406 351 420 349 L712 351 Q726 350 724 335 L726 243 Q725 230 711 231 Z" fill="#efe9fa" stroke="#8265ac" stroke-width="2.5"/><text x="565.0" y="282.0" text-anchor="middle" font-size="25"><tspan x="565.0" dy="0">Dark theme</tspan><tspan x="565.0" dy="32">action-bg → blue 300</tspan></text><path d="M195 353 Q195 395 290 425" class="line" marker-end="url(#arrow)"/><path d="M565 353 Q565 395 470 425" class="line" marker-end="url(#arrow)"/><path d="M148 432 Q135 430 137 445 L135 507 Q136 521 150 519 L612 521 Q626 520 624 505 L626 443 Q625 430 611 431 Z" fill="#e6f3e9" stroke="#4c825e" stroke-width="2.5"/><text x="380.0" y="467.0" text-anchor="middle" font-size="25"><tspan x="380.0" dy="0">Component alias</tspan><tspan x="380.0" dy="32">button-bg → action-bg</tspan></text><path d="M380 523 L380 565" class="line" marker-end="url(#arrow)"/><path d="M113 572 Q100 570 102 585 L100 622 Q101 636 115 634 L647 636 Q661 635 659 620 L661 583 Q660 570 646 571 Z" fill="#fff0df" stroke="#ae7138" stroke-width="2.5"/><text x="380.0" y="610.5" text-anchor="middle" font-size="25"><tspan x="380.0" dy="0">Button uses background: var(--button-bg)</tspan></text></svg>