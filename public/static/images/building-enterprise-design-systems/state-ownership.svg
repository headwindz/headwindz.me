<svg xmlns="http://www.w3.org/2000/svg" width="760" height="740" viewBox="0 0 760 740" role="img" aria-labelledby="title desc"><title id="title">Who owns the selected value?</title><desc id="desc">A user change calls onChange in controlled mode; the parent decides whether to provide a new value. In uncontrolled mode the component updates internal state, initialized from defaultValue. Both can report changes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><style>text{font-family:'Comic Sans MS','Chalkboard SE',cursive;fill:#243449}.line{fill:none;stroke:#475569;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}</style><text x="380" y="43" text-anchor="middle" font-size="30" font-weight="bold"><tspan x="380" dy="0">Who owns the selected value?</tspan></text><path d="M193 82 Q180 80 182 95 L180 132 Q181 146 195 144 L567 146 Q581 145 579 130 L581 93 Q580 80 566 81 Z" fill="#e7f0fc" stroke="#4876ad" stroke-width="2.5"/><text x="380.0" y="120.5" text-anchor="middle" font-size="25"><tspan x="380.0" dy="0">User changes selection</tspan></text><path d="M380 148 L380 185" class="line" marker-end="url(#arrow)"/><rect x="25" y="190" width="340" height="370" rx="18" fill="none" stroke="#8a96a6" stroke-width="2" stroke-dasharray="7 7"/><text x="195.0" y="222" text-anchor="middle" font-size="23" font-weight="bold"><tspan x="195.0" dy="0">Controlled: parent owns value</tspan></text><rect x="395" y="190" width="340" height="370" rx="18" fill="none" stroke="#8a96a6" stroke-width="2" stroke-dasharray="7 7"/><text x="565.0" y="222" text-anchor="middle" font-size="23" font-weight="bold"><tspan x="565.0" dy="0">Uncontrolled: local state</tspan></text><path d="M58 252 Q45 250 47 265 L45 317 Q46 331 60 329 L332 331 Q346 330 344 315 L346 263 Q345 250 331 251 Z" fill="#e7f0fc" stroke="#4876ad" stroke-width="2.5"/><text x="195.0" y="298.0" text-anchor="middle" font-size="25"><tspan x="195.0" dy="0">Call onChange</tspan></text><path d="M195 333 L195 390" class="line" marker-end="url(#arrow)"/><path d="M58 397 Q45 395 47 410 L45 502 Q46 516 60 514 L332 516 Q346 515 344 500 L346 408 Q345 395 331 396 Z" fill="#efe9fa" stroke="#8265ac" stroke-width="2.5"/><text x="195.0" y="447.0" text-anchor="middle" font-size="25"><tspan x="195.0" dy="0">Parent decides whether</tspan><tspan x="195.0" dy="32">to update value</tspan></text><path d="M428 252 Q415 250 417 265 L415 337 Q416 351 430 349 L702 351 Q716 350 714 335 L716 263 Q715 250 701 251 Z" fill="#efe9fa" stroke="#8265ac" stroke-width="2.5"/><text x="565.0" y="292.0" text-anchor="middle" font-size="25"><tspan x="565.0" dy="0">Initialized from</tspan><tspan x="565.0" dy="32">defaultValue</tspan></text><path d="M565 353 L565 390" class="line" marker-end="url(#arrow)"/><path d="M428 397 Q415 395 417 410 L415 502 Q416 516 430 514 L702 516 Q716 515 714 500 L716 408 Q715 395 701 396 Z" fill="#e6f3e9" stroke="#4c825e" stroke-width="2.5"/><text x="565.0" y="447.0" text-anchor="middle" font-size="25"><tspan x="565.0" dy="0">Component updates</tspan><tspan x="565.0" dy="32">internal state</tspan></text><path d="M195 518 L195 585 L300 620" class="line" marker-end="url(#arrow)"/><path d="M565 518 L565 585 L460 620" class="line" marker-end="url(#arrow)"/><path d="M163 622 Q150 620 152 635 L150 687 Q151 701 165 699 L597 701 Q611 700 609 685 L611 633 Q610 620 596 621 Z" fill="#e6f3e9" stroke="#4c825e" stroke-width="2.5"/><text x="380.0" y="668.0" text-anchor="middle" font-size="25"><tspan x="380.0" dy="0">Render the current value</tspan></text></svg>