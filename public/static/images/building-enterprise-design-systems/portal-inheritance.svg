<svg xmlns="http://www.w3.org/2000/svg" width="760" height="790" viewBox="0 0 760 790" role="img" aria-labelledby="title desc"><title id="title">Portal location controls inheritance</title><desc id="desc">A light page contains a dark panel. A dialog portal hosted inside that panel inherits dark tokens. The same dialog hosted directly under the page body inherits light tokens instead.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><style>text{font-family:'Comic Sans MS','Chalkboard SE',cursive;fill:#243449}.line{fill:none;stroke:#475569;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}</style><text x="380" y="43" text-anchor="middle" font-size="30" font-weight="bold"><tspan x="380" dy="0">Portal location controls inheritance</tspan></text><rect x="25" y="75" width="710" height="680" rx="18" fill="none" stroke="#8a96a6" stroke-width="2" stroke-dasharray="7 7"/><text x="380.0" y="107" text-anchor="middle" font-size="23" font-weight="bold"><tspan x="380.0" dy="0">Page body · light theme</tspan></text><rect x="50" y="140" width="660" height="350" rx="18" fill="none" stroke="#8a96a6" stroke-width="2" stroke-dasharray="7 7"/><text x="380.0" y="172" text-anchor="middle" font-size="23" font-weight="bold"><tspan x="380.0" dy="0">Panel · dark theme</tspan></text><path d="M208 197 Q195 195 197 210 L195 242 Q196 256 210 254 L552 256 Q566 255 564 240 L566 208 Q565 195 551 196 Z" fill="#efe9fa" stroke="#8265ac" stroke-width="2.5"/><text x="380.0" y="233.0" text-anchor="middle" font-size="25"><tspan x="380.0" dy="0">Dialog trigger</tspan></text><text x="380" y="300" text-anchor="middle" font-size="23"><tspan x="380" dy="0">Alternative DOM hosts for the same dialog</tspan></text><path d="M193 337 Q180 335 182 350 L180 382 Q181 396 195 394 L567 396 Q581 395 579 380 L581 348 Q580 335 566 336 Z" fill="#e7f0fc" stroke="#4876ad" stroke-width="2.5"/><text x="380.0" y="373.0" text-anchor="middle" font-size="25"><tspan x="380.0" dy="0">Portal host inside panel</tspan></text><path d="M380 398 L380 420" class="line" marker-end="url(#arrow)"/><path d="M163 427 Q150 425 152 440 L150 462 Q151 476 165 474 L597 476 Q611 475 609 460 L611 438 Q610 425 596 426 Z" fill="#e6f3e9" stroke="#4c825e" stroke-width="2.5"/><text x="380.0" y="458.0" text-anchor="middle" font-size="25"><tspan x="380.0" dy="0">Dialog inherits dark tokens</tspan></text><path d="M193 552 Q180 550 182 565 L180 607 Q181 621 195 619 L567 621 Q581 620 579 605 L581 563 Q580 550 566 551 Z" fill="#e7f0fc" stroke="#4876ad" stroke-width="2.5"/><text x="380.0" y="593.0" text-anchor="middle" font-size="25"><tspan x="380.0" dy="0">Default body-level portal</tspan></text><path d="M380 623 L380 660" class="line" marker-end="url(#arrow)"/><path d="M163 667 Q150 665 152 680 L150 707 Q151 721 165 719 L597 721 Q611 720 609 705 L611 678 Q610 665 596 666 Z" fill="#fff0df" stroke="#ae7138" stroke-width="2.5"/><text x="380.0" y="700.5" text-anchor="middle" font-size="25"><tspan x="380.0" dy="0">Dialog inherits light tokens</tspan></text><text x="380" y="535" text-anchor="middle" font-size="23"><tspan x="380" dy="0">Outside the panel’s theme scope</tspan></text></svg>