="url(#arrow)"/><path d="M233 292 Q220 290 222 305 L220 342 Q221 356 235 354 L527 356 Q541 355 539 340 L541 303 Q540 290 526 291 Z" fill="#e6f3e9" stroke="#4c825e" stroke-width="2.5"/><text x="380.0" y="330.5" text-anchor="middle" font-size="25"><tspan x="380.0" dy="0">Styled component</tspan></text><path d="M418 422 Q405 420 407 435 L405 512 Q406 526 420 524 L702 526 Q716 525 714 510 L716 433 Q715 420 701 421 Z" fill="#fff0df" stroke="#ae7138" stroke-width="2.5"/><text x="560.0" y="464.5" text-anchor="middle" font-size="25"><tspan x="560.0" dy="0">Product composition</tspan><tspan x="560.0" dy="32">Content · business rules</tspan></text><path d="M380 358 L380 397 L200 397 L200 565" class="line" marker-end="url(#arrow)"/><path d="M560 528 Q560 560 480 575" class="line" marker-end="url(#arrow)"/><path d="M193 577 Q180 575 182 590 L180 622 Q181 636 195 634 L567 636 Q581 635 579 620 L581 588 Q580 575 566 576 Z" fill="#e6f3e9" stroke="#4c825e" stroke-width="2.5"/><text x="380.0" y="613.0" text-anchor="middle" font-size="25"><tspan x="380.0" dy="0">Product screen</tspan></text></svg>