<svg xmlns="http://www.w3.org/2000/svg" width="760" height="940" viewBox="0 0 760 940" role="img" aria-labelledby="title desc"><title id="title">Migrate only the intended Button</title><desc id="desc">Resolve the Button import binding, including aliases and local shadowing. Leave unrelated components unchanged. Rename a literal type=&quot;danger&quot; only when no spreads or conflicting props exist; report other cases for manual review. Review the diff and run consumer checks.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><style>text{font-family:'Comic Sans MS','Chalkboard SE',cursive;fill:#243449}.line{fill:none;stroke:#475569;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}</style><text x="380" y="43" text-anchor="middle" font-size="30" font-weight="bold"><tspan x="380" dy="0">Migrate only the intended Button</tspan></text><path d="M183 82 Q170 80 172 95 L170 132 Q171 146 185 144 L577 146 Q591 145 589 130 L591 93 Q590 80 576 81 Z" fill="#e7f0fc" stroke="#4876ad" stroke-width="2.5"/><text x="380.0" y="120.5" text-anchor="middle" font-size="25"><tspan x="380.0" dy="0">Find a Button usage</tspan></text><path d="M380 148 L380 190" class="line" marker-end="url(#arrow)"/><path d="M143 197 Q130 195 132 210 L130 277 Q131 291 145 289 L617 291 Q631 290 629 275 L631 208 Q630 195 616 196 Z" fill="#efe9fa" stroke="#8265ac" stroke-width="2.5"/><text x="380.0" y="234.5" text-anchor="middle" font-size="25"><tspan x="380.0" dy="0">Resolve import binding</tspan><tspan x="380.0" dy="32">Intended package? No local shadow?</tspan></text><path d="M130 245 L70 245 L70 345 L165 345" class="line" marker-end="url(#arrow)"/><text x="70" y="225" text-anchor="middle" font-size="23"><tspan x="70" dy="0">No</tspan></text><path d="M183 317 Q170 315 172 330 L170 362 Q171 376 185 374 L577 376 Q591 375 589 360 L591 328 Q590 315 576 316 Z" fill="#fff0df" stroke="#ae7138" stroke-width="2.5"/><text x="380.0" y="353.0" text-anchor="middle" font-size="25"><tspan x="380.0" dy="0">Leave unrelated usages unchanged</tspan></text><path d="M630 245 L695 245 L695 415 L380 415 L380 450" class="line" marker-end="url(#arrow)"/><text x="690" y="225" text-anchor="middle" font-size="23"><tspan x="690" dy="0">Yes</tspan></text><path d="M143 457 Q130 455 132 470 L130 552 Q131 566 145 564 L617 566 Q631 565 629 550 L631 468 Q630 455 616 456 Z" fill="#efe9fa" stroke="#8265ac" stroke-width="2.5"/><text x="380.0" y="502.0" text-anchor="middle" font-size="25"><tspan x="380.0" dy="0">Literal type=&quot;danger&quot;?</tspan><tspan x="380.0" dy="32">No spreads or conflicting props?</tspan></text><path d="M245 568 L245 625" class="line" marker-end="url(#arrow)"/><text x="210" y="605" text-anchor="middle" font-size="23"><tspan x="210" dy="0">Yes</tspan></text><path d="M515 568 L515 625" class="line" marker-end="url(#arrow)"/><text x="550" y="605" text-anchor="middle" font-size="23"><tspan x="550" dy="0">No</tspan></text><path d="M53 632 Q40 630 42 645 L40 717 Q41 731 55 729 L357 731 Q371 730 369 715 L371 643 Q370 630 356 631 Z" fill="#e6f3e9" stroke="#4c825e" stroke-width="2.5"/><text x="205.0" y="672.0" text-anchor="middle" font-size="25"><tspan x="205.0" dy="0">Rename type</tspan><tspan x="205.0" dy="32">to status</tspan></text><path d="M413 632 Q400 630 402 645 L400 717 Q401 731 415 729 L707 731 Q721 730 719 715 L721 643 Q720 630 706 631 Z" fill="#fff0df" stroke="#ae7138" stroke-width="2.5"/><text x="560.0" y="672.0" text-anchor="middle" font-size="25"><tspan x="560.0" dy="0">Report for</tspan><tspan x="560.0" dy="32">manual review</tspan></text><path d="M205 733 L205 785 L300 820" class="line" marker-end="url(#arrow)"/><path d="M560 733 L560 785 L460 820" class="line" marker-end="url(#arrow)"/><path d="M113 827 Q100 825 102 840 L100 892 Q101 906 115 904 L647 906 Q661 905 659 890 L661 838 Q660 825 646 826 Z" fill="#e7f0fc" stroke="#4876ad" stroke-width="2.5"/><text x="380.0" y="857.0" text-anchor="middle" font-size="25"><tspan x="380.0" dy="0">Review diff</tspan><tspan x="380.0" dy="32">Run consumer checks</tspan></text></svg>