<svg xmlns="http://www.w3.org/2000/svg" width="760" height="760" viewBox="0 0 760 760" role="img" aria-labelledby="title desc"><title id="title">One token source, several outputs</title><desc id="desc">Versioned tokens are validated and aliases resolved before Style Dictionary transforms generate CSS variables, JavaScript values and TypeScript declarations, and platform-specific outputs when needed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><style>text{font-family:'Comic Sans MS','Chalkboard SE',cursive;fill:#243449}.line{fill:none;stroke:#475569;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}</style><text x="380" y="43" text-anchor="middle" font-size="30" font-weight="bold"><tspan x="380" dy="0">One token source, several outputs</tspan></text><path d="M163 87 Q150 85 152 100 L150 142 Q151 156 165 154 L597 156 Q611 155 609 140 L611 98 Q610 85 596 86 Z" fill="#e7f0fc" stroke="#4876ad" stroke-width="2.5"/><text x="380.0" y="128.0" text-anchor="middle" font-size="25"><tspan x="380.0" dy="0">Versioned token source</tspan></text><path d="M380 158 L380 200" class="line" marker-end="url(#arrow)"/><path d="M163 207 Q150 205 152 220 L150 287 Q151 301 165 299 L597 301 Q611 300 609 285 L611 218 Q610 205 596 206 Z" fill="#efe9fa" stroke="#8265ac" stroke-width="2.5"/><text x="380.0" y="244.5" text-anchor="middle" font-size="25"><tspan x="380.0" dy="0">Validate token types</tspan><tspan x="380.0" dy="32">Resolve aliases</tspan></text><path d="M380 303 L380 345" class="line" marker-end="url(#arrow)"/><path d="M163 352 Q150 350 152 365 L150 412 Q151 426 165 424 L597 426 Q611 425 609 410 L611 363 Q610 350 596 351 Z" fill="#e6f3e9" stroke="#4c825e" stroke-width="2.5"/><text x="380.0" y="395.5" text-anchor="middle" font-size="25"><tspan x="380.0" dy="0">Style Dictionary transforms</tspan></text><rect x="70" y="475" width="620" height="255" rx="18" fill="none" stroke="#8a96a6" stroke-width="2" stroke-dasharray="7 7"/><text x="380.0" y="507" text-anchor="middle" font-size="23" font-weight="bold"><tspan x="380.0" dy="0">Generated formats</tspan></text><path d="M138 532 Q125 530 127 545 L125 565 Q126 579 140 577 L652 579 Q666 578 664 563 L666 543 Q665 530 651 531 Z" fill="#e7f0fc" stroke="#4876ad" stroke-width="2.5"/><text x="395.0" y="562.0" text-anchor="middle" font-size="25"><tspan x="395.0" dy="0">CSS variables → web styles</tspan></text><path d="M138 597 Q125 595 127 610 L125 630 Q126 644 140 642 L652 644 Q666 643 664 628 L666 608 Q665 595 651 596 Z" fill="#efe9fa" stroke="#8265ac" stroke-width="2.5"/><text x="395.0" y="627.0" text-anchor="middle" font-size="25"><tspan x="395.0" dy="0">JS values + TypeScript declarations</tspan></text><path d="M138 662 Q125 660 127 675 L125 695 Q126 709 140 707 L652 709 Q666 708 664 693 L666 673 Q665 660 651 661 Z" fill="#fff0df" stroke="#ae7138" stroke-width="2.5"/><text x="395.0" y="692.0" text-anchor="middle" font-size="25"><tspan x="395.0" dy="0">Platform outputs → when needed</tspan></text><path d="M380 428 L380 455 L95 455 L95 685" class="line" marker-end="url(#arrow)"/><path d="M95 554 L122 554" class="line" marker-end="url(#arrow)"/><path d="M95 619 L122 619" class="line" marker-end="url(#arrow)"/><path d="M95 684 L122 684" class="line" marker-end="url(#arrow)"/></svg>