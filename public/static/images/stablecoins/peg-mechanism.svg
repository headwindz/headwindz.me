>
  <title id="title">The intended peg mechanism</title>
  <desc id="desc">
    Above the peg, burning LUNA and minting UST expands supply and creates downward price pressure.
    Below the peg, burning UST and minting LUNA contracts UST supply, with upward pressure
    contingent on demand and functioning markets.
  </desc>
