<svg
  xmlns="http://www.w3.org/2000/svg"
  width="960"
  height="730"
  viewBox="0 0 960 730"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Fiat-backed: cash in, tokens out</title>
  <desc id="desc">
    Top lane: an eligible participant pays dollars to an issuer, which mints USDC to a wallet.
    Bottom lane: USDC is returned and burned, and dollars are paid to a bank account. Issuer reserve
    assets support redemption.
  </desc>
  <defs>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="8"
      markerHeight="8"
      orient="auto-start-reverse"
    >
      <path
        d="M1 1 L9 5 L1 9"
        fill="none"
        stroke="#687583"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </marker>
  </defs>
  <g font-family="'Comic Sans MS', 'Chalkboard SE', cursive">
    <text x="40" y="48" font-size="28" fill="#26313b" font-weight="600" text-anchor="start">
      Fiat-backed: cash in, tokens out
    </text>
    <text x="40" y="79" font-size="16" fill="#64748b" font-weight="400" text-anchor="start">
      Issuance and redemption are separate operations.
    </text>
    <text x="40" y="130" font-size="17" fill="#2476a2" font-weight="600" text-anchor="start">
      01 · ISSUE TOKENS
    </text>
    <path
      d="M62 154 Q150.0 151 238 154 Q261 153 260 176 L259 235 Q260 258 238 257 L63 256 Q39 257 41 235 L40 176 Q39 154 62 154 Z"
      fill="#2476a2"
      fill-opacity=".055"
