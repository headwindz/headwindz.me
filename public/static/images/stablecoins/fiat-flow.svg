      stroke="#a9561d"
      stroke-width="2.8"
      stroke-linejoin="round"
    />
    <text x="355" y="549" font-size="20" fill="#a9561d" font-weight="600" text-anchor="start">
      Reserve assets
    </text>
    <text x="355" y="582" font-size="17" fill="#34404c" font-weight="400" text-anchor="start">
      Bank deposits / T-bills
    </text>
    <path
      d="M480 509 L480 454"
      fill="none"
      stroke="#687583"
      stroke-width="1.8"
      stroke-linecap="round"
