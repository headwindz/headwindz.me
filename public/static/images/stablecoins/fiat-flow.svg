      stroke-width="2.8"
      stroke-linejoin="round"
    />
    <text x="390" y="378" font-size="20" fill="#287d3b" font-weight="600" text-anchor="start">
      Issuer
    </text>
    <text x="390" y="411" font-size="17" fill="#34404c" font-weight="400" text-anchor="start">
      Burns returned
    </text>
    <text x="390" y="437" font-size="17" fill="#34404c" font-weight="400" text-anchor="start">
      USDC
    </text>
    <path
      d="M722 345 Q810.0 342 898 345 Q921 344 920 367 L919 426 Q920 449 898 448 L723 447 Q699 448 701 426 L700 367 Q699 345 722 345 Z"
      fill="#2476a2"
      fill-opacity=".055"
      stroke="#2476a2"
      stroke-width="2.8"
      stroke-linejoin="round"
    />
    <text x="720" y="378" font-size="20" fill="#2476a2" font-weight="600" text-anchor="start">
      Bank account
    </text>
    <text x="720" y="411" font-size="17" fill="#34404c" font-weight="400" text-anchor="start">
      Receives USD
    </text>
    <path
      d="M265 395 L363 395"
      fill="none"
      stroke="#687583"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      marker-end="url(#arrow)"
    />
    <text x="315" y="360" font-size="15" fill="#34404c" font-weight="400" text-anchor="middle">
      Return 1M
    </text>
    <text x="315" y="384" font-size="15" fill="#34404c" font-weight="400" text-anchor="middle">
      USDC
    </text>
    <path
      d="M595 395 L693 395"
      fill="none"
      stroke="#687583"
      stroke-width="1.8"
