      height="48"
      rx="12"
      fill="none"
      stroke="#9aa19b"
      stroke-dasharray="8 8"
    />
    <text x="480" y="680" font-size="16" fill="#34404c" font-weight="400" text-anchor="middle">
      Mint / redeem access depends on issuer terms; a wallet alone is not enough.
    </text>
  </g>
</svg>
