      stroke-linejoin="round"
    />
    <text x="60" y="187" font-size="20" fill="#2476a2" font-weight="600" text-anchor="start">
      Participant
    </text>
    <text x="60" y="220" font-size="17" fill="#34404c" font-weight="400" text-anchor="start">
      Mint eligible
    </text>
    <path
      d="M392 154 Q480.0 151 568 154 Q591 153 590 176 L589 235 Q590 258 568 257 L393 256 Q369 257 371 235 L370 176 Q369 154 392 154 Z"
      fill="#287d3b"
      fill-opacity=".055"
      stroke="#287d3b"
      stroke-width="2.8"
      stroke-linejoin="round"
    />
    <text x="390" y="187" font-size="20" fill="#287d3b" font-weight="600" text-anchor="start">
      Issuer
    </text>
    <text x="390" y="220" font-size="17" fill="#34404c" font-weight="400" text-anchor="start">
