<svg xmlns="http://www.w3.org/2000/svg" width="600" height="625" viewBox="0 0 600 625" role="img"><title>Rollups need both transaction data and a mechanism to settle state claims on L1</title><g font-family="Comic Sans MS, Chalkboard SE, cursive" font-weight="500"><path d="M42 27 Q300.0 23 560 26 Q572 27 570 39 L568 121 Q570 135 556 133 L42 132 Q29 133 31 120 L30 39 Q29 26 42 27Z" fill="#23628d" fill-opacity=".06" stroke="#23628d" stroke-width="2.5"/><text x="48" y="63" fill="#23628d" font-size="25">L2: execute many transactions</text><text x="48" y="95" fill="#23628d" font-size="25">Sequence and batch activity</text><path d="M170 138 L170 190" stroke="#23628d" stroke-width="2.5" fill="none" /><path d="M164 181 L170 190 L176 181" transform="rotate(0 170 190)" fill="none" stroke="#23628d" stroke-width="2.5"/><path d="M430 138 L430 190" stroke="#73518c" stroke-width="2.5" fill="none" /><path d="M424 181 L430 190 L436 181" transform="rotate(0 430 190)" fill="none" stroke="#73518c" stroke-width="2.5"/><path d="M37 197 Q157.5 193 280 196 Q292 197 290 209 L288 306 Q290 320 276 318 L37 317 Q24 318 26 305 L25 209 Q24 196 37 197Z" fill="#376749" fill-opacity=".06" stroke="#376749" stroke-width="2.5"/><text x="43" y="233" fill="#376749" font-size="25">Transaction data</text><text x="43" y="265" fill="#376749" font-size="25">Reconstruct state</text><path d="M322 197 Q442.5 193 565 196 Q577 197 575 209 L573 306 Q575 320 561 318 L322 317 Q309 318 311 305 L310 209 Q309 196 322 197Z" fill="#73518c" fill-opacity=".06" stroke="#73518c" stroke-width="2.5"/><text x="328" y="233" fill="#73518c" font-size="25">State claims</text><text x="328" y="265" fill="#73518c" font-size="25">Dispute or prove</text><path d="M170 323 L170 373" stroke="#376749" stroke-width="2.5" fill="none" /><path d="M164 364 L170 373 L176 364" transform="rotate(0 170 373)" fill="none" stroke="#376749" stroke-width="2.5"/><path d="M430 323 L430 373" stroke="#73518c" stroke-width="2.5" fill="none" /><path d="M424 364 L430 373 L436 364" transform="rotate(0 430 373)" fill="none" stroke="#73518c" stroke-width="2.5"/><path d="M42 382 Q300.0 378 560 381 Q572 382 570 394 L568 478 Q570 492 556 490 L42 489 Q29 490 31 477 L30 394 Q29 381 42 382Z" fill="#925018" fill-opacity=".06" stroke="#925018" stroke-width="2.5"/><text x="48" y="418" fill="#925018" font-size="25">L1: enforce settlement rules</text><text x="48" y="450" fill="#925018" font-size="25">Data availability + verification</text><text x="25" y="550" fill="#33485e" font-size="24">An early L2 receipt is not the same</text><text x="25" y="582" fill="#33485e" font-size="24">as final settlement on Ethereum.</text></g></svg>