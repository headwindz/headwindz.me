" y="443" fill="#23628d" font-size="25">Settle on L1</text><path d="M337 77 Q450.0 73 565 76 Q577 77 575 89 L573 135 Q575 149 561 147 L337 146 Q324 147 326 134 L325 89 Q324 76 337 77Z" fill="#73518c" fill-opacity=".06" stroke="#73518c" stroke-width="2.5"/><text x="343" y="113" fill="#73518c" font-size="25">Execute batch</text><path d="M450 150 L450 178" stroke="#73518c" stroke-width="2.5" fill="none" /><path d="M444 169 L450 178 L456 169" transform="rotate(0 450 178)" fill="none" stroke="#73518c" stroke-width="2.5"/><path d="M337 187 Q450.0 183 565 186 Q577 187 575 199 L573 245 Q575 259 561 257 L337 256 Q324 257 326 244 L325 199 Q324 186 337 187Z" fill="#73518c" fill-opacity=".06" stroke="#73518c" stroke-width="2.5"/><text x="343" y="223" fill="#73518c" font-size="25">Generate proof</text><path d="M450 260 L450 288" stroke="#73518c" stroke-width="2.5" fill="none" /><path d="M444 279 L450 288 L456 279" transform="rotate(0 450 288)" fill="none" stroke="#73518c" stroke-width="2.5"/><path d="M337 297 Q450.0 293 565 296 Q577 297 575 309 L573 355 Q575 369 561 367 L337 366 Q324 367 326 354 L325 309 Q324 296 337 297Z" fill="#73518c" fill-opacity=".06" stroke="#73518c" stroke-width="2.5"/><text x="343" y="333" fill="#73518c" font-size="25">L1 verifies proof</text><path d="M450 370 L450 398" stroke="#73518c" stroke-width="2.5" fill="none" /><path d="M444 389 L450 398 L456 389" transform="rotate(0 450 398)" fill="none" stroke="#73518c" stroke-width="2.5"/><path d="M337 407 Q450.0 403 565 406 Q577 407 575 419 L573 465 Q575 479 561 477 L337 476 Q324 477 326 464 L325 419 Q324 406 337 407Z" fill="#73518c" fill-opacity=".06" stroke="#73518c" stroke-width="2.5"/><text x="343" y="443" fill="#73518c" font-size="25">Settle on L1</text><text x="25" y="555" fill="#33485e" font-size="24">Compare data, upgrade keys, and exits.</text><text x="25" y="587" fill="#33485e" font-size="24">Neither design is automatically private.</text></g></svg>