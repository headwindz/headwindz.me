<svg xmlns="http://www.w3.org/2000/svg" width="600" height="610" viewBox="0 0 600 610" role="img"><title>Platform-controlled records compared with key-authorized shared records</title><g font-family="Comic Sans MS, Chalkboard SE, cursive" font-weight="500"><text x="25" y="38" fill="#925018" font-size="25">Platform account</text><path d="M37 67 Q145.0 63 255 66 Q267 67 265 79 L263 138 Q265 152 251 150 L37 149 Q24 150 26 137 L25 79 Q24 66 37 67Z" fill="#925018" fill-opacity=".06" stroke="#925018" stroke-width="2.5"/><text x="43" y="103" fill="#925018" font-size="25">You sign in</text><path d="M265 105 L320 105" stroke="#33485e" stroke-width="2.5" fill="none" /><path d="M314 96 L320 105 L326 96" transform="rotate(-90 320 105)" fill="none" stroke="#33485e" stroke-width="2.5"/><path d="M337 67 Q450.0 63 565 66 Q577 67 575 79 L573 138 Q575 152 561 150 L337 149 Q324 150 326 137 L325 79 Q324 66 337 67Z" fill="#925018" fill-opacity=".06" stroke="#925018" stroke-width="2.5"/><text x="343" y="103" fill="#925018" font-size="25">Platform database</text><text x="25" y="192" fill="#925018" font-size="25">Operator controls access</text><text x="25" y="224" fill="#925018" font-size="25">and the authoritative record.</text><text x="25" y="278" fill="#23628d" font-size="25">Protocol account</text><path d="M37 307 Q145.0 303 255 306 Q267 307 265 319 L263 378 Q265 392 251 390 L37 389 Q24 390 26 377 L25 319 Q24 306 37 307Z" fill="#23628d" fill-opacity=".06" stroke="#23628d" stroke-width="2.5"/><text x="43" y="343" fill="#23628d" font-size="25">Your key signs</text><path d="M265 345 L320 345" stroke="#33485e" stroke-width="2.5" fill="none" /><path d="M314 336 L320 345 L326 336" transform="rotate(-90 320 345)" fill="none" stroke="#33485e" stroke-width="2.5"/><path d="M337 307 Q450.0 303 565 306 Q577 307 575 319 L573 378 Q575 392 561 390 L337 389 Q324 390 326 377 L325 319 Q324 306 337 307Z" fill="#376749" fill-opacity=".06" stroke="#376749" stroke-width="2.5"/><text x="343" y="343" fill="#376749" font-size="25">Shared ledger</text><path d="M450 390 L450 435" stroke="#376749" stroke-width="2.5" fill="none" /><path d="M444 426 L450 435 L456 426" transform="rotate(0 450 435)" fill="none" stroke="#376749" stroke-width="2.5"/><path d="M337 442 Q450.0 438 565 441 Q577 442 575 454 L573 513 Q575 527 561 525 L337 524 Q324 525 326 512 L325 454 Q324 441 337 442Z" fill="#73518c" fill-opacity=".06" stroke="#73518c" stroke-width="2.5"/><text x="343" y="478" fill="#73518c" font-size="25">Another app</text><text x="25" y="455" fill="#23628d" font-size="25">Original app gone?</text><text x="25" y="487" fill="#23628d" font-size="25">Records can remain.</text><text x="25" y="575" fill="#33485e" font-size="24">Keys do not preserve off-chain files.</text></g></svg>