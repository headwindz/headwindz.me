orm="rotate(0 450 197)" fill="none" stroke="#73518c" stroke-width="2.5"/><path d="M337 209 Q450.0 205 565 208 Q577 209 575 221 L573 280 Q575 294 561 292 L337 291 Q324 292 326 279 L325 221 Q324 208 337 209Z" fill="#73518c" fill-opacity=".06" stroke="#73518c" stroke-width="2.5"/><text x="343" y="245" fill="#73518c" font-size="25">Selected by stake</text><path d="M450 295 L450 329" stroke="#73518c" stroke-width="2.5" fill="none" /><path d="M444 320 L450 329 L456 320" transform="rotate(0 450 329)" fill="none" stroke="#73518c" stroke-width="2.5"/><path d="M337 341 Q450.0 337 565 340 Q577 341 575 353 L573 412 Q575 426 561 424 L337 423 Q324 424 326 411 L325 353 Q324 340 337 341Z" fill="#73518c" fill-opacity=".06" stroke="#73518c" stroke-width="2.5"/><text x="343" y="377" fill="#73518c" font-size="25">Propose + attest</text><text x="25" y="520" fill="#33485e" font-size="24">Both still need nodes to check rules.</text><text x="25" y="552" fill="#33485e" font-size="24">Stake adds penalties for slashable acts.</text></g></svg>