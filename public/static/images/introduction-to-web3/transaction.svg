<svg xmlns="http://www.w3.org/2000/svg" width="600" height="610" viewBox="0 0 600 610" role="img"><title>A Bitcoin transaction from authorization to additional confirmations</title><g font-family="Comic Sans MS, Chalkboard SE, cursive" font-weight="500"><circle cx="50" cy="57" r="23" fill="none" stroke="#23628d" stroke-width="2.5"/><text x="42" y="66" fill="#23628d" font-size="25">1</text><text x="98" y="55" fill="#23628d" font-size="25">Sign</text><text x="98" y="89" fill="#33485e" font-size="24">Wallet authorizes a spend</text><path d="M50 83 L50 127" stroke="#23628d" stroke-width="2.5" fill="none" /><path d="M44 118 L50 127 L56 118" transform="rotate(0 50 127)" fill="none" stroke="#23628d" stroke-width="2.5"/><circle cx="50" cy="172" r="23" fill="none" stroke="#73518c" stroke-width="2.5"/><text x="42" y="181" fill="#73518c" font-size="25">2</text><text x="98" y="170" fill="#73518c" font-size="25">Relay</text><text x="98" y="204" fill="#33485e" font-size="24">Peers share the transaction</text><path d="M50 198 L50 242" stroke="#73518c" stroke-width="2.5" fill="none" /><path d="M44 233 L50 242 L56 233" transform="rotate(0 50 242)" fill="none" stroke="#73518c" stroke-width="2.5"/><circle cx="50" cy="287" r="23" fill="none" stroke="#925018" stroke-width="2.5"/><text x="42" y="296" fill="#925018" font-size="25">3</text><text x="98" y="285" fill="#925018" font-size="25">Mine</text><text x="98" y="319" fill="#33485e" font-size="24">Miner proposes a PoW block</text><path d="M50 313 L50 357" stroke="#925018" stroke-width="2.5" fill="none" /><path d="M44 348 L50 357 L56 348" transform="rotate(0 50 357)" fill="none" stroke="#925018" stroke-width="2.5"/><circle cx="50" cy="402" r="23" fill="none" stroke="#376749" stroke-width="2.5"/><text x="42" y="411" fill="#376749" font-size="25">4</text><text x="98" y="400" fill="#376749" font-size="25">Verify</text><text x="98" y="434" fill="#33485e" font-size="24">Nodes independently check it</text><path d="M50 428 L50 472" stroke="#376749" stroke-width="2.5" fill="none" /><path d="M44 463 L50 472 L56 463" transform="rotate(0 50 472)" fill="none" stroke="#376749" stroke-width="2.5"/><circle cx="50" cy="517" r="23" fill="none" stroke="#23628d" stroke-width="2.5"/><text x="42" y="526" fill="#23628d" font-size="25">5</text><text x="98" y="515" fill="#23628d" font-size="25">Confirm</text><text x="98" y="549" fill="#33485e" font-size="24">More blocks build on top</text></g></svg>