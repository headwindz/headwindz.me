<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img"><title>Custody and key exposure are independent wallet decisions</title><g font-family="Comic Sans MS, Chalkboard SE, cursive" font-weight="500"><text x="25" y="38" fill="#23628d" font-size="25">Who can authorize spending?</text><path d="M37 67 Q157.5 63 280 66 Q292 67 290 79 L288 188 Q290 202 276 200 L37 199 Q24 200 26 187 L25 79 Q24 66 37 67Z" fill="#23628d" fill-opacity=".06" stroke="#23628d" stroke-width="2.5"/><text x="43" y="103" fill="#23628d" font-size="25">You hold keys</text><text x="43" y="135" fill="#23628d" font-size="25">Self-custody</text><path d="M322 67 Q442.5 63 565 66 Q577 67 575 79 L573 188 Q575 202 561 200 L322 199 Q309 200 311 187 L310 79 Q309 66 322 67Z" fill="#925018" fill-opacity=".06" stroke="#925018" stroke-width="2.5"/><text x="328" y="103" fill="#925018" font-size="25">Provider holds keys</text><text x="328" y="135" fill="#925018" font-size="25">Custody risk</text><text x="25" y="262" fill="#73518c" font-size="25">How are the keys exposed?</text><path d="M37 292 Q157.5 288 280 291 Q292 292 290 304 L288 413 Q290 427 276 425 L37 424 Q24 425 26 412 L25 304 Q24 291 37 292Z" fill="#73518c" fill-opacity=".06" stroke="#73518c" stroke-width="2.5"/><text x="43" y="328" fill="#73518c" font-size="25">Online signer</text><text x="43" y="360" fill="#73518c" font-size="25">Malware / phishing</text><path d="M322 292 Q442.5 288 565 291 Q577 292 575 304 L573 413 Q575 427 561 425 L322 424 Q309 425 311 412 L310 304 Q309 291 322 292Z" fill="#376749" fill-opacity=".06" stroke="#376749" stroke-width="2.5"/><text x="328" y="328" fill="#376749" font-size="25">Offline signer</text><text x="328" y="360" fill="#376749" font-size="25">Loss / recovery</text><text x="25" y="490" fill="#33485e" font-size="25">These are separate questions.</text><text x="25" y="522" fill="#33485e" font-size="25">An offline key can still sign</text><text x="25" y="554" fill="#33485e" font-size="25">a harmful transaction.</text></g></svg>