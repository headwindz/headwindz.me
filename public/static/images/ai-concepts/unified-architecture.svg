<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1070" viewBox="0 0 800 1070" role="img" aria-labelledby="title description">
<title id="title">Unified AI system architecture</title>
<desc id="description">Inside the harness, hooks and guardrails govern orchestration, agent execution and capabilities. The orchestrator routes workflows or multiple agents. Agents use a ReAct loop, the LLM, skills and tools. Plugins supply skills and MCP integrations. Tools reach APIs, databases and files. Verification evaluates execution.</desc>
