<svg xmlns="http://www.w3.org/2000/svg" width="800" height="697" viewBox="0 0 800 697" role="img" aria-labelledby="title description">
<title id="title">Runtime and evaluation harness</title>
<desc id="description">A benchmark task enters the harness. It provisions a workspace, injects context, runs the agent in a sandbox, records telemetry, and verifies the result to produce a verdict.</desc>
