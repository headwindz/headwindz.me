<polyline points="400.0,431 400,450 214.5,450 214.5,474" fill="none" stroke="#52606d" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="400.0,431 400,450 585.5,450 585.5,474" fill="none" stroke="#52606d" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/>
