<svg xmlns="http://www.w3.org/2000/svg" width="800" height="960" viewBox="0 0 800 960" role="img" aria-labelledby="title description">
<title id="title">Five multi-agent coordination patterns</title>
<desc id="description">A supervisor dispatches and receives summaries, a pipeline passes work forward, peers exchange drafts and critiques, workers share a state board, and fork-join reconciles parallel investigations.</desc>
