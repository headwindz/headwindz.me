<text x="45" y="49" text-anchor="start" fill="#225d82" font-size="25">1. Hierarchical supervisor</text>
<rect x="25" y="210" width="750" height="148" rx="22" fill="none" stroke="#8c451a" stroke-width="1.6" stroke-dasharray="9 7"/>
<text x="45" y="241" text-anchor="start" fill="#8c451a" font-size="25">2. Sequential pipeline</text>
<rect x="25" y="378" width="750" height="151" rx="22" fill="none" stroke="#28663f" stroke-width="1.6" stroke-dasharray="9 7"/>
<text x="45" y="409" text-anchor="start" fill="#28663f" font-size="25">3. Peer debate / critic</text>
<rect x="25" y="549" width="750" height="148" rx="22" fill="none" stroke="#65468e" stroke-width="1.6" stroke-dasharray="9 7"/>
<text x="45" y="580" text-anchor="start" fill="#65468e" font-size="25">4. Shared blackboard</text>
