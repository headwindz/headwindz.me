<polyline points="505,794.0 536,794.0 536,827 561,827.0" fill="none" stroke="#52606d" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="235,827.0 260,827 260,870.0 291,870.0" fill="none" stroke="#52606d" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/>
